services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
    extra_hosts:
      - "host.docker.internal:host-gateway"
